# nginx for the CWC web interface (inside the "web" container).
# Serves the built React app and forwards /api to the backend container.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fax uploads (the backend allows 25 MB per file, 50 MB per request)
    client_max_body_size 50m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;   # the fax viewer embeds PDFs from /api
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8080;               # service name on the internal network
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;                      # a slow fax on the local model
        proxy_send_timeout 600s;
    }

    # Hashed build assets can be cached; index.html must not be.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces the server-level ones, so repeat them
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Single-page app: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
