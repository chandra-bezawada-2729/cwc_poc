# Test profile — uses the same dev database but a separate storage tree under target/
# AI service calls are mocked; no live LLM calls are made in any test.
cwc.storage.base-path=${java.io.tmpdir}/cwc-test-storage
cwc.ingestion.folder-watch.enabled=false

# Turn off Flyway repair in tests to keep migrations clean
spring.flyway.out-of-order=false
