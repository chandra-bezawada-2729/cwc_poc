# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=cwc-backend

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cwc}
spring.datasource.username=${DB_USERNAME:cwc}
spring.datasource.password=${DB_PASSWORD:cwc_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=cwc
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Flyway owns the schema — never update
spring.jpa.hibernate.ddl-auto=validate

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=cwc
spring.flyway.default-schema=cwc
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── File upload limits ────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# ── AI service ────────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:5002}

# ── Storage (§16.5: base-path resolved to absolute at startup) ────────────────
# Default resolves from cwc-backend/ → repo-root storage/. Override with an
# absolute path via STORAGE_BASE env var when running a packaged jar.
cwc.storage.base-path=${STORAGE_BASE:../storage}
cwc.storage.incoming-dir=incoming
cwc.storage.routed-dir=routed

# ── Ingestion (§16.7: fax-server timestamp zone, never hardcoded) ─────────────
# America/New_York handles EDT/EST automatically. Confirm with CWC (see OPEN_QUESTIONS.md).
cwc.ingestion.fax-server-zone=${FAX_SERVER_ZONE:America/New_York}

# ── Confidence thresholds ─────────────────────────────────────────────────────
cwc.confidence.auto-threshold=0.85
cwc.confidence.review-threshold=0.60

# ── Routing mode ──────────────────────────────────────────────────────────────
# Not a Spring property: routing-config.yml owns the mode, and the
# CWC_ROUTING_MODE environment variable overrides it. See RoutingEngineService.
#   SUGGEST = nothing moves until a human clicks Confirm Routing
#   AUTO    = HIGH confidence files immediately; everything else queues

# ── Async thread pool ─────────────────────────────────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=cwc-async-

# ── Folder watcher — stand-in for real fax-server integration (spec §14) ─────
# Set to true to ingest files dropped into storage/incoming automatically.
# Disabled by default — enable for folder-drop demo.
cwc.ingestion.folder-watch.enabled=false
cwc.ingestion.folder-watch.debounce-ms=2000

# ── Metadata extraction ───────────────────────────────────────────────────────
# Extract metadata automatically once a document has been filed and is ROUTED.
# It runs on the async pool, after filing, so it cannot delay or fail routing.
# PHI posture: with this on, patient name/DOB/MRN are extracted for EVERY fax,
# not only the ones staff chose to extract. See OPEN_QUESTIONS.md item 8.
cwc.extraction.auto-extract=${CWC_AUTO_EXTRACT:true}

# ── Debug (PHI safety: default false) ────────────────────────────────────────
cwc.debug.log-ocr-text=false

# Keep session closed after each request — avoids LazyInitializationException too
spring.jpa.open-in-view=false

# ── CORS (frontend dev server) ────────────────────────────────────────────────
cwc.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3001}

# ═══════════════════════════════════════════════════════════════════════════════
# Inbound folder automation (supersedes cwc.ingestion.folder-watch.*)
# ═══════════════════════════════════════════════════════════════════════════════
# Polls CWC's inbound folder, ingests anything whose CONTENT HASH is not already
# in cwc.ingest_ledger, files it into the outbound tree, and archives the original.
#
# Off by default. Enabling this while cwc.ingestion.folder-watch.enabled is also
# true is a configuration error and fails fast at startup.
cwc.ingestion.inbound.enabled=${INBOUND_ENABLED:false}

# Absolute path to the OneDrive/SharePoint-synced inbound folder. REQUIRED when
# enabled. Forward slashes are fine on Windows.
cwc.ingestion.inbound.path=${INBOUND_PATH:}

cwc.ingestion.inbound.recursive=true

# Polling, not WatchService: Java's watch API does not deliver events reliably on
# OneDrive-synced or SMB folders.
cwc.ingestion.inbound.poll-interval-ms=15000

# A file must be untouched for this long before first ingest. Raise it if faxes
# arrive over a slow link — the cost of being wrong is reading a partial PDF.
cwc.ingestion.inbound.min-stable-ms=10000

cwc.ingestion.inbound.archive-dir=_processed
cwc.ingestion.inbound.failed-dir=_failed
cwc.ingestion.inbound.archive-by-date=true

cwc.ingestion.inbound.max-attempts=3
cwc.ingestion.inbound.retry-backoff-ms=60000

# Bounds one cycle so pointing at a large backlog cannot saturate the async pool
# and the AI service at once.
cwc.ingestion.inbound.max-per-cycle=25

cwc.ingestion.inbound.require-path-at-startup=true

# ── Outbound tree ─────────────────────────────────────────────────────────────
# For automated operation this should point at CWC's real outbound folder — the
# one shaped like "Sample for Avenir Digital". The routing engine creates the
# category subfolders on demand.
# cwc.storage.base-path=C:/Users/ABC/CWC
# cwc.storage.routed-dir=Outbound

# ── Automated routing ─────────────────────────────────────────────────────────
# AUTO is required for unattended operation; SUGGEST leaves everything for a human.
# Set the environment variable, not a property:  CWC_ROUTING_MODE=AUTO
