# CWC backend - production settings for the CBWCHC server.
# Copy to D:\cwc\app\cwc-backend\config\application-prod.properties, fill in the
# CHANGE_ME values, and restrict the file to Administrators + the service account.

server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/cwc
spring.datasource.username=cwc
spring.datasource.password=CHANGE_ME

ai.service.url=http://127.0.0.1:5002

# The browser only ever talks to IIS on the same origin; this is belt and braces.
cwc.cors.allowed-origins=https://CHANGE_ME.cbwchc.internal

# Fax folders (forward slashes)
cwc.ingestion.inbound.enabled=true
cwc.ingestion.inbound.path=D:/CWC_FAX/Inbound
cwc.ingestion.inbound.require-path-at-startup=true
cwc.storage.base-path=D:/CWC_FAX
cwc.storage.routed-dir=Outbound

# Never write OCR text (PHI) to logs
cwc.debug.log-ocr-text=false
