# CWC Healthcare Fax — Golden Metadata Labels for Phase 9 Field-Level Evaluation
#
# REVIEW STATUS: labels marked "review: true" need human verification against
# the actual PDF before being used for definitive scoring.
#
# Field values use dot-path notation: core.X or categoryData.X
# List fields: value is a list; matching is order-insensitive subset check.
# Fuzzy fields: set fuzzy: true; string similarity >= 0.8 counts as a match.
# null expected: the extractor must return null (not a non-null value).
# omit (no entry): field is not scored for this sample.
#
# Confidently-wrong threshold: confidence >= 0.85 AND value does not match label.

