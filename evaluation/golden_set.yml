# CWC Healthcare Fax — Golden Set
# ─────────────────────────────────────────────────────────────────────────────
# GOLDEN SET VERSION: 2.0   |   TAXONOMY: v2.0 (folder-aligned)
#
# 47 hand-labelled samples in three blocks:
#
#   A. ORIGINAL INBOUND (5)   the payer/pharmacy faxes the POC was built on,
#                             relabelled into the v2.0 taxonomy.
#   B. NEW INBOUND (12)       the samples CWC supplied after the POC demo.
#   C. AVENIR REFERENCE (30)  documents CWC ALREADY FILED BY HAND. For these the
#                             folder and the filename are not our judgement —
#                             they are what CWC actually did. `expected_folder`
#                             is the folder they put it in and `expected_file_name`
#                             is the name they gave it. This block is the only
#                             true ground truth in the set; treat a failure here
#                             as a real miss, not a labelling dispute.
#
# WARNING: These filenames reference real patient faxes in CWC_DATASET_PATH.
# Do NOT copy file contents here. Never commit actual PDFs.
#
# `accept_specifications` lists alternative specifications that should also be
# considered correct — CWC's own naming is not perfectly consistent (their tree
# holds both "Home Care Form.pdf" and "Homecare form.pdf"), so scoring the
# specification exactly would penalise the model for CWC's own variance.

golden_set_version: "2.0"
taxonomy_version: "2.0"

samples:

  # ═══════════════════════════════════════════════════════════════════════════
  # BLOCK A — the original 5 inbound faxes, relabelled for taxonomy v2.0
  # Every one of these previously had its own top-level category. CWC files them
  # all into Miscellaneous; the old code now lives in expected_subtype.
  # ═══════════════════════════════════════════════════════════════════════════

  - file: "(212)497-8948_2026-08-18_0943PM.pdf"
    block: original_inbound
    expected_category: MISCELLANEOUS
    expected_subtype: PAYER_CARE_GAP
    expected_folder: Miscellaneous
    expected_specification: "Care Gap Notice"
    accept_specifications: ["Insurance Letter", "Quality Measure Notice"]
    expected_file_name: "Care Gap Notice.pdf"
    action_required: true
    response_deadline: "2026-09-01"
    sender_organization: Healthfirst
    notes: >
      v1.0 label was PAYER_CARE_GAP → Care-Gaps. CWC has no Care-Gaps folder;
      their Miscellaneous folder holds the equivalent Healthfirst provider
      letter. BOUNDARY CASE: the fax carries accept/decline response boxes and a
      fax-back deadline, which under disambiguation rule 2 could argue for FORM.
      It is labelled MISCELLANEOUS because the reply boxes are part of the letter
      rather than a separate enclosed form — see OPEN_QUESTIONS item 12.

  - file: "(305)503-8807_2026-08-19_0702AM.pdf"
    block: original_inbound
    expected_category: MISCELLANEOUS
    expected_subtype: FOLLOW_UP_REMINDER
    expected_folder: Miscellaneous
    expected_specification: "Imaging Follow Up"
    accept_specifications: ["Follow Up Reminder", "Radiology Follow Up"]
    expected_file_name: "Imaging Follow Up.pdf"
    action_required: true
    response_deadline: null
    sender_organization: Main Street Radiology
    notes: >
      Trap preserved from v1.0: sent by a radiology practice and referencing a
      prior US Abdomen study, which pulls toward RADIOLOGY_REPORT. It contains no
      new FINDINGS or IMPRESSION — it is a reminder generated from a prior report.
      Disambiguation rule 3 requires new results for RADIOLOGY_REPORT, so this is
      correspondence. Note CWC's own Radiology Reports folder contains a real
      "US Abdomen.pdf" — the contrast is exactly the trap.

  - file: "(360)200-5103_2026-08-19_0137AM.pdf"
    block: original_inbound
    expected_category: MISCELLANEOUS
    expected_subtype: MEDICATION_REVIEW
    expected_folder: Miscellaneous
    expected_specification: "Medication Review"
    accept_specifications: ["Prescription Request", "Polypharmacy Review"]
    expected_file_name: "Medication Review.pdf"
    action_required: true
    response_deadline: null
    sender_organization: RxAdvocate
    notes: >
      Trap preserved: full of drug names, which pulls toward a prescription
      reading. It requests review of existing medications. CWC's own
      Miscellaneous/Prescription Request.pdf is the same document family (a VNS
      Health medication therapy management review), which is what fixes the folder.

  - file: "(603)935-9108_2026-08-18_0945PM.pdf"
    block: original_inbound
    expected_category: MISCELLANEOUS
    expected_subtype: PHARMACY_REQUEST
    expected_folder: Miscellaneous
    expected_specification: "Prescription Request"
    accept_specifications: ["Medication Request"]
    expected_file_name: "Prescription Request.pdf"
    action_required: true
    response_deadline: null
    contains_fillable_form: true
    page_count: 2
    sender_organization: Amazon Pharmacy
    notes: >
      HARDEST BOUNDARY IN THE SET. Page 2 is a fillable Medication Request form
      with authorize/deny checkboxes and a prescriber signature block, which under
      rule 2 argues for FORM — and CWC DID file an analogous supplier form
      (Acelleron's DME certificate) under Forms. It is labelled MISCELLANEOUS to
      match CWC's Miscellaneous/Prescription Request.pdf. This single boundary
      decides several future faxes; see OPEN_QUESTIONS item 13.

  - file: "(614)321-2042_2026-08-18_1004PM.pdf"
    block: original_inbound
    expected_category: MISCELLANEOUS
    expected_subtype: PRIOR_AUTHORIZATION
    expected_folder: Miscellaneous
    expected_specification: "Prescription Authorization"
    accept_specifications: ["Prior Authorization Follow Up"]
    expected_file_name: "Prescription Authorization.pdf"
    action_required: true
    response_deadline: null
    sender_organization: CoverMyMeds
    notes: >
      Trap preserved: titled "Prior Authorization Follow Up", so the words
      "Follow Up" pull toward a reminder. CWC's own
      Miscellaneous/Prescription Authorization.pdf is the identical CoverMyMeds
      document type, which fixes both the folder and the house-style name.

